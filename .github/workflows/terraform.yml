name: terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"

jobs:
  validate:
    name: fmt, validate, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      # Modules declare configuration_aliases, so they cannot be validated
      # standalone without a provider block. Validating from the root covers
      # them through the module calls.
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

  security:
    name: security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false

  runbooks:
    name: runbook links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A runbook with a broken cross-reference is discovered at 3am
      # otherwise.
      - name: check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --verbose --no-progress './**/*.md'
          fail: true
